name: CI Build, Push & Auto Update Tag

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'getcontact-k8s.yaml'
      - 'nginx-withrc.yaml'
      - 'README.md'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Generate Short SHA Tag
        id: vars
        run: echo "SHA_SHORT=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/getcontact-web:${{ env.SHA_SHORT }}
          ${{ secrets.DOCKER_USERNAME }}/getcontact-web:latest

      - name: Update Kubernetes Manifest
        run: |
          # Perbarui image tag pada file manifest k8s (sesuaikan nama file jika memakai getcontact-k8s.yaml atau nginx-withrc.yaml)
          TARGET_FILE="getcontact-k8s.yaml"
          [ -f "nginx-withrc.yaml" ] && TARGET_FILE="nginx-withrc.yaml"
          sed -i -E "s|image: .*/getcontact-web:.*|image: ${{ secrets.DOCKER_USERNAME }}/getcontact-web:${{ env.SHA_SHORT }}|g" $TARGET_FILE

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add getcontact-k8s.yaml nginx-withrc.yaml 2>/dev/null || true
          git commit -m "chore(gitops): update image tag to ${SHA_SHORT} [skip ci]" || exit 0
          git push origin main