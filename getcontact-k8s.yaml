apiVersion: v1
kind: Namespace
metadata:
  name: getcontact

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: getcontact-web-deploy
  namespace: getcontact
  labels:
    app.kubernetes.io/name: getcontact-web
    environment: development
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: getcontact-web
  template:
    metadata:
      labels:
        app: getcontact-web
    spec:
      containers:
        - name: getcontact-web
          image: saintshiro16/getcontact-web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          readinessProbe:
            httpGet:
              path: /fpm-ping
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /fpm-ping
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3

---

apiVersion: v1
kind: Service
metadata:
  name: getcontact-web-service
  namespace: getcontact
spec:
  type: ClusterIP
  selector:
    app: getcontact-web
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: getcontact-web-ingress
  namespace: getcontact
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  tls:
    - hosts:
        - get-contact.6cfc738b-ced1-4334-8cd1-cfa279e71cda.k8s.civo.com
      secretName: getcontact-tls
  rules:
    - host: get-contact.6cfc738b-ced1-4334-8cd1-cfa279e71cda.k8s.civo.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: getcontact-web-service
                port:
                  number: 80