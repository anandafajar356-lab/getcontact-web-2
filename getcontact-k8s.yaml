apiVersion: v1
kind: Namespace
metadata:
  name: getcontact

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: getcontact-nginx-config
  namespace: getcontact
data:
  default.conf: |
    server_names_hash_bucket_size 128;

    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
    limit_req_status 429;
    limit_conn_status 429;

    server {
        listen 8080;
        server_name _;

        root /var/www/html;
        index index.php index.html;

        limit_conn conn_limit 20;

        # Endpoint khusus health check Kubernetes (bypass filter & FastCGI)
        location = /healthz {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Blokir file & folder sensitif
        location ~ /\.(git|github|env|htaccess) {
            deny all;
            return 404;
        }

        location ~ ^/(sql|src)/ {
            deny all;
            return 404;
        }

        location ~* \.(ya?ml|md|sql)$ {
            deny all;
            return 404;
        }

        location = /Dockerfile {
            deny all;
            return 404;
        }

        # Routing aplikasi utama
        location / {
            limit_req zone=general_limit burst=20 nodelay;

            if ($http_x_forwarded_proto != "https") {
                return 301 https://$host$request_uri;
            }

            try_files $uri $uri/ /index.php?$query_string;
        }

        # FastCGI ke PHP-FPM TCP port 9000
        location ~ \.php$ {
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }
    }

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: getcontact-web-deploy
  namespace: getcontact
  labels:
    app.kubernetes.io/name: getcontact-web
    environment: development
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: getcontact-web
  template:
    metadata:
      labels:
        app: getcontact-web
    spec:
      containers:
        - name: getcontact-web
          image: saintshiro16/getcontact-web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: nginx-conf
          configMap:
            name: getcontact-nginx-config

---

apiVersion: v1
kind: Service
metadata:
  name: getcontact-web-service
  namespace: getcontact
spec:
  type: ClusterIP
  selector:
    app: getcontact-web
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: getcontact-web-ingress
  namespace: getcontact
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  tls:
    - hosts:
        - get-contact.6cfc738b-ced1-4334-8cd1-cfa279e71cda.k8s.civo.com
      secretName: getcontact-tls
  rules:
    - host: get-contact.6cfc738b-ced1-4334-8cd1-cfa279e71cda.k8s.civo.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: getcontact-web-service
                port:
                  number: 80